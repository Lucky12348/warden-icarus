# Icarus docker-compose.yml (mornedhels/icarus-server image), "manageable by warden-icarus" version.
# Every setting comes from the .env (${VAR}) so that the bot only rewrites the .env; the .env names
# (SERVERNAME, JOIN_PASSWORD...) are translated to the image's names (SERVER_NAME, SERVER_PASSWORD...).
# SaveGameOnExit, GameSaveFrequency, FiberFoliageRespawn and LargeStonesRespawn are not image
# variables: the bot changes them directly in data/Saved/Config/WindowsServer/ServerSettings.ini.
services:
  icarus:
    image: mornedhels/icarus-server:latest
    container_name: icarus
    hostname: icarus
    restart: unless-stopped
    # Must cover supervisord's stopwaitsecs (90 s) to give the game time to save.
    stop_grace_period: 90s
    ports:
      - "32768:32768/udp"
      - "32784:32784/udp"
    volumes:
      - ./data:/home/icarus/drive_c/icarus
      - ./game:/opt/icarus
    environment:
      - SERVER_NAME=${SERVERNAME}
      - SERVER_PORT=32768
      - SERVER_QUERYPORT=32784
      - SERVER_PASSWORD=${JOIN_PASSWORD}
      - SERVER_ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SERVER_MAX_PLAYERS=${MAX_PLAYERS}
      - SERVER_SHUTDOWN_IF_NOT_JOINED=${SHUTDOWN_NOT_JOINED_FOR}
      - SERVER_SHUTDOWN_IF_EMPTY=${SHUTDOWN_EMPTY_FOR}
      - SERVER_ALLOW_NON_ADMINS_LAUNCH=${ALLOW_NON_ADMINS_LAUNCH}
      - SERVER_ALLOW_NON_ADMINS_DELETE=${ALLOW_NON_ADMINS_DELETE}
      - SERVER_RESUME_PROSPECT=${RESUME_PROSPECT}
      # Automatic game update, only when the server is empty (checked through A2S).
      - UPDATE_CRON=${UPDATE_CRON:-*/30 * * * *}
      - PUID=1000
      - PGID=1000
